version: '3.8' # Specifies the Docker Compose file format version

services:
  # MySQL database used by Keycloak
  keycloak-mysql:
    container_name: keycloak-mysql # Custom name for the MySQL container
    image: mysql:8 # Uses the official MySQL 8 image from Docker Hub
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql # Persists MySQL data on the host
    environment:
      MYSQL_ROOT_PASSWORD: root # Root password for MySQL
      MYSQL_DATABASE: keycloak  # Database name to be created for Keycloak
      MYSQL_USER: keycloak      # Username for Keycloak to connect to the DB
      MYSQL_PASSWORD: password  # Password for the Keycloak DB user

  # Keycloak authentication server
  keycloak:
    container_name: keycloak # Custom name for the Keycloak container
    image: quay.io/keycloak/keycloak:24.0.1 # Uses a specific Keycloak version
    command: [ "start-dev", "--import-realm" ] 
    # "start-dev" runs Keycloak in development mode (no HTTPS required)
    # "--import-realm" tells Keycloak to import realm data on startup

    environment:
      DB_VENDOR: MYSQL         # Database vendor (MySQL)
      DB_ADDR: mysql           # Hostname of the MySQL service 
      DB_DATABASE: keycloak    # Database name to connect to
      DB_USER: keycloak        # Username for DB access
      DB_PASSWORD: password    # Password for DB access
      KEYCLOAK_ADMIN: admin    # Admin username to be created on first start
      KEYCLOAK_ADMIN_PASSWORD: admin # Admin password

    ports:
      - "8181:8080" # Maps host port 8181 (local) to container port 8080 (Keycloak default)

    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
      # Mounts realm configuration files from the host for import into Keycloak

    depends_on:
      - keycloak-mysql # Ensures MySQL starts before Keycloak
  
  loki:
    image: grafana/loki:main
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
     - '3100:3100'
     
  prometheus:
   image: prom/prometheus:v2.46.0
   command:
    - --enable-feature=exemplar-storage
    - --config.file=/etc/prometheus/prometheus.yml
    # Config for prometheus scrapping actuator
   volumes:
    - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
   ports:
    - '9090:9090'
    
  tempo:
   image: grafana/tempo:2.2.2  # Tempo Docker image for distributed tracing
   command: ['-config.file=/etc/tempo.yaml']  # Use external config file instead of default
   volumes:
    - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro  # Map local config file into container (read-only)
    - ./docker/tempo/tempo-data:/tmp/tempo  # Persist trace data locally
   ports:
    - '3110:3100'  # Tempo HTTP API port
    - '9411:9411'  # Zipkin-compatible port for tracing clients
    
  grafana:
   image: grafana/grafana:10.1.0
   volumes:
    - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
   environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_AUTH_DISABLE_LOGIN_FORM=true
   ports:
    - '3000:3000'
