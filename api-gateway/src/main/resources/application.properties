spring.application.name=api-gateway
server.port=9000

## KEYCLOAK REALM
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/spring-microservices-security-realm

## OPEN API
springdoc.swagger-ui.path=/swagger-ui.html
# OPEN API JSON ENDPOINT http://localhost:9000/api-docs
springdoc.api-docs.path=/api-docs

# 'aggregate' is a convention to group different microservices' Swagger paths under a common prefix
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/aggregate/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/aggregate/inventory-service/v3/api-docs

product.service.url=http://localhost:8080
order.service.url=http://localhost:8081
inventory.service.url=http://localhost:8082

## ACTUATOR ENDPOINTS

# Enable health indicators for circuit breakers to monitor their status
management.health.circuitbreakers.enabled=true
# Expose all actuator endpoints over HTTP (for example: /actuator/health, /actuator/metrics)
management.endpoints.web.exposure.include=*
# Always show detailed health information, including all component statuses
management.endpoint.health.show-details=always

# Loki URL
loki.url=http://localhost:3100/loki/api/v1/push

#### RESILIENCE4J

## Properties
# Register a health indicator for circuit breakers to expose their status via Actuator
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
# Use a count-based sliding window for calculating failure rate and metrics
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
# Size of the sliding window (number of calls to consider for metrics)
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
# Failure rate threshold (%) to open the circuit breaker (e.g., 50% failures)
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
# Duration the circuit breaker stays open before transitioning to half-open (in seconds)
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
# Number of permitted calls when in half-open state to test if service recovered
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
# Automatically transition from open to half-open state after wait duration
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
# Minimum number of calls required before calculating failure rate
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5

## Resilience4j Timeout Properties
# Timeout duration for calls wrapped by the time limiter (e.g., max 3 seconds per call)
resilience4j.timelimiter.configs.default.timeout-duration=3s

## Resilience4j Retry Properties
# Maximum number of retry attempts for failed calls
resilience4j.retry.configs.default.max-attempts=3
# Wait duration between retry attempts
resilience4j.retry.configs.default.wait-duration=2s

## Spring Boot Actuator Metrics and Tracing Properties

# Enable histogram percentiles for HTTP server request metrics (for detailed latency analysis)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Add an application name tag to observations and metrics (useful for filtering/monitoring)
management.observations.key-values.application=api-gateway
# Set sampling probability for tracing (1.0 means capture all traces)
management.tracing.sampling.probability=1.0