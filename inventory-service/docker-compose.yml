version: '4'  # Docker Compose file format version

services:
  mysql:
    image: mysql:8.3.0  # Use the official mysql image (v 8.3.0)
    container_name: mysql-inventory  # Set a custom name for the container
    environment:
      MYSQL_ROOT_PASSWORD: mysql  # Set the root username
    ports:
      # Mapping local port (left) to container's port (right)
      - "3308:3306"  # Expose Mysql port to the host
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Mount the local './mysql' directory 
      - ./docker/mysql/data:/var/lib/mysql
      
  