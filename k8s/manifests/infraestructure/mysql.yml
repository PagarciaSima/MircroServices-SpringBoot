          persistentVolumeClaim:
            claimName: mysql-inventory-pvc
        - name: mysql-inventory-initdb-config
          configMap:
            name: mysql-inventory-initdb-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-inventory-service
  labels:
    app: mysql-inventory
spec:
  type: NodePort
  selector:
    app: mysql-inventory
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30008
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-inventory-secrets
type: Opaque
data:
  mysql_inventory_root_password: bXlzcWw=
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-inventory-pv
spec:
  storageClassName: standard
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/mysql-inventory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-inventory-pvc
spec:
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-inventory-initdb-config
data:
  initdb.sql: |
    CREATE DATABASE IF NOT EXISTS inventory_service;
