spring.application.name=order-service
server.port=8081

### DB Config
spring.datasource.url=jdbc:mysql://localhost:3307/order_service
spring.datasource.username=root
spring.datasource.password=mysql
# Disabled since we use flyway DB migration
spring.jpa.hibernate.ddl-auto=none
inventory.url=http://localhost:8082

## OPEN API
springdoc.swagger-ui.path=/swagger-ui.html
# JSON OPEN API http://localhost:8081/api-docs
springdoc.api-docs.path=/api-docs

# Enable health indicators for circuit breakers to monitor their status
management.health.circuitbreakers.enabled=true
# Expose all actuator endpoints over HTTP (for example: /actuator/health, /actuator/metrics)
management.endpoints.web.exposure.include=*
# Always show detailed health information, including all component statuses
management.endpoint.health.show-details=always

#### RESILIENCE4J (It is set up for the inventory service instance -> Check InventoryClient notations)

## Properties
# Register a health indicator for circuit breakers to expose their status via Actuator
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
# Use a count-based sliding window for calculating failure rate and metrics
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
# Size of the sliding window (number of calls to consider for metrics)
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=10
# Failure rate threshold (%) to open the circuit breaker (e.g., 50% failures)
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
# Duration the circuit breaker stays open before transitioning to half-open (in seconds)
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
# Number of permitted calls when in half-open state to test if service recovered
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
# Automatically transition from open to half-open state after wait duration
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
# Minimum number of calls required before calculating failure rate
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

## Resilience4j Timeout Properties
# Timeout duration for calls wrapped by the time limiter (e.g., max 3 seconds per call)
resilience4j.timelimiter.instances.inventory.timeout-duration=3s

## Resilience4j Retry Properties
# Maximum number of retry attempts for failed calls
resilience4j.retry.instances.inventory.max-attempts=3
# Wait duration between retry attempts
resilience4j.retry.instances.inventory.wait-duration=2s

## Spring Boot Actuator Metrics and Tracing Properties

# Enable histogram percentiles for HTTP server request metrics (for detailed latency analysis)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Add an application name tag to observations and metrics (useful for filtering/monitoring)
management.observations.key-values.application=api-gateway
# Set sampling probability for tracing (1.0 means capture all traces)
management.tracing.sampling.probability=1.0